<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>To Do List</title>

<style>
    body{
        margin:0;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#cfcfcf;
        font-family:Arial, sans-serif;
    }

    .todo-paper{
        width:380px;
        background:#fff;
        box-shadow:0 4px 10px rgba(0,0,0,0.25);
        padding-bottom:30px;
    }

    .todo-header{
        background:#ece4b7;
        text-align:center;
        padding:25px 0;
    }

    .todo-header h1{
        margin:0;
        font-size:58px;
        font-family:cursive;
        font-weight:normal;
        color:#000;
    }

    .todo-body{
        padding:20px 35px;
    }

    .todo-line{
        display:flex;
        align-items:center;
        height:34px;
        border-bottom:1px solid #bdbdbd;
    }

    .check-box{
        width:18px;
        height:18px;
        background:#f6efc6;
        margin-right:12px;
        flex-shrink:0;
    }

    .line-space{
        flex:1;
    }
</style>
</head>

<body>

<div class="todo-paper">

    <div class="todo-header">
        <h1>to-do list</h1>
    </div>

    <div class="todo-body">

        <div class="todo-line"><div class="check-box"></div><div class="line-space">pritam</div></div>
        <div class="todo-line"><div class="check-box"></div><div class="line-space">kap</div></div>
        <div class="todo-line"><div class="check-box"></div><div class="line-space"></div></div>
        <div class="todo-line"><div class="check-box"></div><div class="line-space"></div></div>
        <div class="todo-line"><div class="check-box"></div><div class="line-space"></div></div>
        <div class="todo-line"><div class="check-box"></div><div class="line-space"></div></div>
        <div class="todo-line"><div class="check-box"></div><div class="line-space"></div></div>
        <div class="todo-line"><div class="check-box"></div><div class="line-space"></div></div>
        <div class="todo-line"><div class="check-box"></div><div class="line-space"></div></div>
        <div class="todo-line"><div class="check-box"></div><div class="line-space"></div></div>
        <div class="todo-line"><div class="check-box"></div><div class="line-space"></div></div>
        <div class="todo-line"><div class="check-box"></div><div class="line-space"></div></div>
        <div class="todo-line"><div class="check-box"></div><div class="line-space"></div></div>
        <div class="todo-line"><div class="check-box"></div><div class="line-space"></div></div>

    </div>

</div>

</body>
</html>
