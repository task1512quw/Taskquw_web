<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
  :root {
    --dbt-teal: #008ba3;
    --dbt-bg: #f4f6f8;
    --line: #cbd5e0;
  }



  .tree ul {
    padding-top: 20px;
    position: relative;
  }

  .tree li {
    list-style-type: none;
    position: relative;
    padding: 20px 0 0 40px;
  }

  /* Vertical line */
  .tree li::before {
    content: '';
    position: absolute;
    top: 0;
    left: 12px;
    border-left: 2px solid var(--line);
    height: 100%;
  }

  /* Horizontal line */
  .tree li::after {
    content: '';
    position: absolute;
    top: 32px;
    left: 12px;
    width: 20px;
    border-top: 2px solid var(--line);
  }

  /* Remove extra line from last child */
  .tree li:last-child::before {
    height: 32px;
  }

  /* Node row */
  .node-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* Expand button */
  .toggle {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    border: none;
    background: var(--dbt-teal);
    color: white;
    cursor: pointer;
    font-size: 14px;
    line-height: 20px;
    font-weight: bold;
  }

  /* Card */
  .node-card {
    width: 220px;
    background: white;
    border: 2px solid var(--dbt-teal);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }

  .node-header {
    background-color: var(--dbt-teal);
    color: white;
    padding: 6px 12px;
    font-size: 10px;
    font-weight: bold;
    text-transform: uppercase;
    display: flex;
    align-items: center;
  }

  .dot {
    background: #ff694b;
    border-radius: 50%;
    width: 12px;
    height: 12px;
    margin-right: 6px;
  }

  .node-body {
    padding: 14px;
    text-align: center;
    font-weight: 600;
    color: #333;
  }

  .source {
    border-color: #94a3b8;
  }

  .children {
    display: none;
  }

  .children.show {
    display: block;
  }

  .node-card:hover {
    transform: translateY(-2px);
    transition: .2s ease;
  }
</style>
</head>

<body>

<div class="tree">
  <ul>

    <!-- ROOT -->
    <li>

      <div class="node-row">
        <button class="toggle">+</button>

        <div class="node-card source">
          <div class="node-body">
            src_imdb_data
          </div>
        </div>
      </div>

      <!-- CHILDREN -->
      <ul class="children">

        <li>

          <div class="node-row">
            <button class="toggle">+</button>

            <div class="node-card">
              <div class="node-header">
                <span class="dot"></span>
                MODEL
              </div>

              <div class="node-body">
                stg_imdb_ratings
              </div>
            </div>
          </div>

          <!-- GRANDCHILD -->
          <ul class="children">

            <li>
              <div class="node-row">
                <div style="width:20px;"></div>
                <div class="node-card">
                  <div class="node-header">
                    <span class="dot"></span>
                    MODEL
                  </div>
                  <div class="node-body">
                    fct_movie_rankings
                  </div>
                </div>
              </div>
            </li>

            <li>
              <div class="node-row">

                <div style="width:20px;"></div>

                <div class="node-card">
                  <div class="node-header">
                    <span class="dot"></span>
                    MODEL
                  </div>

                  <div class="node-body">
                    dim_movie_summary
                  </div>
                </div>

              </div>
            </li>

          </ul>

        </li>

      </ul>

    </li>

  </ul>
</div>

<script>
  const toggles = document.querySelectorAll('.toggle');

  toggles.forEach(toggle => {
    toggle.addEventListener('click', () => {

      const parentLi = toggle.closest('li');
      const children = parentLi.querySelector(':scope > .children');

      if (children) {
        children.classList.toggle('show');

        toggle.textContent =
          children.classList.contains('show') ? '−' : '+';
      }
    });
  });
</script>

</body>
</html>
